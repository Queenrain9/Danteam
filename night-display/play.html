  <title>한밤의 진열장 | 실험 B</title>
  <style>

t:119px;z-index:2;transition:transform .25s,opacity .25s}.visitor-head{display:block;position:relative;margin:auto;width:75px;height:67px;border-radius:39px 37px 31px 34px;background:#eee2be;box-shadow:inset -8px -6px #d1c2a2}.eye{position:absolute;top:34px;width:5px;height:8px;border-radius:50%;background:#293140}.eye-left{left:24px}.eye-right{right:25px}.visitor-body{display:block;margin:-4px auto 0;width:67px;height:65px;border-radius:28px 28px 7px 7px;background:#656b7a}.visitor-arm{position:absolute;right:-12px;top:73px;width:22px;height:13px;border-radius:12px;background:#e8dab7;opacity:0}.visitor[data-beat="GAZE"]{transform:translateX(calc(-50% + var(--gaze-shift,0px)))}.visitor[data-beat="ACTION"] .visitor-arm{opacity:1}.visitor[data-reaction="R0"][data-beat="ACTION"]{opacity:.46}.hidden-guest{position:absolute;top:84px;left:47%;font-size:45px;color:#faf0c4;opacity:0;z-index:1}.hidden-guest.active{opacity:.72;filter:drop-shadow(0 0 12px #f0dfa0)}.shelf-wrap{position:absolute;bottom:13px;left:11px;right:11px;z-index:4}.shelf-title{display:flex;justify-content:space-between;font-size:11px;color:#f0e9d4;letter-spacing:.02em;margin-bottom:5px}.shelf-title span{color:var(--gold)}.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:7px 5px 5px;border-radius:8px 8px 3px 3px;border:1px solid #95795b;background:linear-gradient(#8c755a,#79614a)}.slot{border:2px dashed #d6ba8e;border-radius:7px;min-height:86px;background:#efe4cd;color:#354055;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px 3px;font-size:11px;position:relative;touch-action:none}.slot-caption{font-size:10px;opacity:.75}.slot-content{font-size:26px;line-height:1.5;min-height:42px;display:flex;align-items:center}.slot:disabled{cursor:default;opacity:.9}.slot.filled{border-style:solid}.slot.selected{border-color:#7d9dc8;box-shadow:0 0 0 3px #b1d8ff8c}.slot.clue{border-color:#f8dc7b;animation:highlight .65s ease-in-out 1;box-shadow:inset 0 0 0 3px #d9b95180}.slot.drop-target{border-color:#70afae;transform:translateY(-3px)}.slot .item-mini{font-size:12px;margin-left:3px}.residue{height:5px;margin:3px auto 0;width:60%;border-radius:10px;transition:background .2s}.scene[data-reaction="R1"] .residue.active{background:radial-gradient(ellipse,#f8e8a8,transparent 75%);height:9px}.scene[data-reaction="R2"] .residue.active{background:repeating-radial-gradient(ellipse,#e6d6a7 0 2px,transparent 3px 8px);height:10px}.scene[data-reaction="R0"] .residue.active{background:linear-gradient(90deg,transparent,#b8ad96,transparent);height:2px}.scene[data-reaction="H"] .residue.active{background:#e8debb65;height:3px}.message{display:flex;align-items:center;gap:11px;border:1px solid #4f5c69;background:#202a3a;border-radius:10px;padding:10px 12px;min-height:64px}.message-icon{font-size:26px;color:var(--gold);width:27px;text-align:center}.message-title{font-weight:750;font-size:14px}.message p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.4}.section-label{display:flex;justify-content:space-between;font-size:11px;color:var(--gold);margin-bottom:6px}.section-label span{color:var(--muted);font-size:10px}.tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.item-card{display:flex;min-width:0;flex-direction:column;align-items:center;justify-content:center;min-height:75px;border:2px solid #9a8666;border-radius:8px;background:var(--card);color:#354055;gap:2px;font-size:12px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}.item-icon{font-family:Georgia,serif;font-size:26px;line-height:1.1}.item-card.selected{border-color:#81c0f0;box-shadow:0 0 0 3px #8fc7f88c}.item-card.placed{opacity:.4;background:#b9b4ad}.item-card:disabled{cursor:default}.controls{display:flex;flex-direction:column;gap:6px}.primary,.secondary{min-height:47px;padding:10px 12px;border-radius:10px;font-weight:750;border:1px solid var(--gold)}.primary{background:var(--gold);color:var(--ink)}.primary:disabled{background:#485260;color:#bfc2c7;border-color:#6b727b;cursor:default}.secondary{background:#28384b;color:var(--text)}.counter{text-align:center;color:var(--muted);font-size:10px;margin:4px 0 0;line-height:1.4}footer{text-align:center;color:#a6adb6;font-size:10px;padding-bottom:3px}@keyframes highlight{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}@media (max-width:340px){.game{padding-left:12px;padding-right:12px;gap:9px}.scene{min-height:256px;flex-basis:256px}.slot{min-height:77px}.item-card{min-height:65px}.shelf-wrap{left:7px;right:7px}}@media (max-height:690px){.game{gap:7px}.scene{min-height:239px;flex-basis:239px}.header{min-height:46px}.item-card{min-height:61px}.message{min-height:55px;padding:7px 10px}.visitor{top:21px}.moon{top:9px}.doorplate{top:74px}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* v0.1.1: a visible, coordinate-linked wipe on the ORIGINAL doorplate. */
.doorplate::after{content:'';position:absolute;inset:2px;border-radius:4px;z-index:1;pointer-events:none;background:repeating-linear-gradient(125deg,#aaa38a99 0 3px,#756c5b99 3px 6px);opacity:.95}
.doorplate.wiping::after{animation:wipe-dust .45s ease-in forwards}
.doorplate.revealed::after{opacity:0}
@keyframes wipe-dust{0%,26%{opacity:.95;clip-path:inset(0 0 0 0)}65%{opacity:.5;clip-path:inset(0 0 0 48%)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}
.visitor[data-reaction="R3"][data-beat="ACTION"] .visitor-arm{opacity:1;transform:translate(var(--wipe-x,0px),var(--wipe-y,0px));transition:transform .38s ease-in-out,opacity .12s}
/* Hidden visitor occupies the vacant wall beside the regular visitor, not underneath their body. */
.hidden-guest{left:calc(50% - 102px);z-index:2}
/* Keep a departed guest absent on the R0 RESULT, until manual rearrange. */
.visitor[data-reaction="R0"][data-beat="ACTION"],.visitor[data-reaction="R0"][data-beat="RESIDUE"],.scene[data-reaction="R0"][data-phase="RESULT"] .visitor{opacity:0;transform:translateX(calc(-50% + 55px))}
/* C/B/K have distinguishable tiny object motions, without revealing another cause slot. */
.slot.clue[data-item="C"] .slot-content{animation:cue-candle .48s ease-in-out 1;transform-origin:center bottom}
.slot.clue[data-item="B"] .slot-content,.slot.secondary-cue[data-item="B"] .slot-content{animation:cue-bell .45s ease-in-out 1}
.slot.clue[data-item="K"] .slot-content{animation:cue-key .45s ease-in-out 1}
@keyframes cue-candle{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-7deg) scaleY(1.08)}}
@keyframes cue-bell{0%,100%{transform:rotate(0deg)}25%,75%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes cue-key{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
/* Slot-specific marks: the mirror reflection stays below M; bell ripples stay below B. */
.residue{position:relative;left:var(--residue-left,50%);transform:translateX(-50%);margin-left:0;margin-right:0;width:28%}
.scene[data-reaction="R0"] .residue.active{width:60%}
/* The wiping hand must pass IN FRONT of the fixed plate, not disappear behind its stacking layer. */
.scene[data-reaction="R3"][data-phase="REACT"] .visitor[data-beat="ACTION"]{z-index:5}
/* A short sleeve-to-fingertip bridge makes the actual reach legible without a new sprite. */
.visitor[data-reaction="R3"][data-beat="ACTION"] .visitor-arm::before{content:'';position:absolute;right:12px;top:3px;width:calc(var(--wipe-x,72px) + 8px);height:7px;border-radius:8px;background:linear-gradient(90deg,#777d8a 0%,#e8dab7 48%,#e8dab7 100%);transform-origin:right center;animation:arm-extend .38s ease-in-out forwards}
@keyframes arm-extend{from{width:6px}to{width:calc(var(--wipe-x,72px) + 8px)}}

/* v0.1.2: distinguish looking at the back wall from looking at the center object. */
.scene[data-reaction="H"][data-phase="REACT"] .visitor[data-beat="GAZE"] .visitor-head{
  transform:translateY(-8px) scale(.93);background:#d0c3a5;box-shadow:inset 5px -7px #b9a987;
  transition:transform .18s ease-out,background .18s ease-out;
}
.scene[data-reaction="H"][data-phase="REACT"] .visitor[data-beat="GAZE"] .eye{opacity:0}
/* R0: every shelf position gets equal, brief attention; no highlighted slot. */
.scene[data-reaction="R0"][data-phase="REACT"] .visitor[data-beat="GAZE"] .visitor-head{
  animation:neutral-three-slot-scan .54s linear both;
}
@keyframes neutral-three-slot-scan{
  0%{transform:translateX(-13px) rotate(-5deg)}
  50%{transform:translateX(0) rotate(0)}
  100%{transform:translateX(13px) rotate(5deg)}
}
/* Move the existing single hand and short arm bridge to the actually occupied M/B slot. */
.scene[data-phase="REACT"] .visitor[data-reaction="R1"][data-beat="ACTION"],
.scene[data-phase="REACT"] .visitor[data-reaction="R2"][data-beat="ACTION"]{z-index:5}
.visitor[data-reaction="R1"][data-beat="ACTION"] .visitor-arm,
.visitor[data-reaction="R2"][data-beat="ACTION"] .visitor-arm{
  opacity:1;transform:translate(var(--target-dx,0px),var(--target-dy,0px));transition:transform .33s ease-out;
}
.visitor[data-reaction="R1"][data-beat="ACTION"] .visitor-arm::before,
.visitor[data-reaction="R2"][data-beat="ACTION"] .visitor-arm::before{
  content:'';position:absolute;left:11px;top:6px;
  width:var(--reach-length,6px);height:7px;border-radius:7px;
  transform-origin:left center;transform:rotate(var(--reach-angle,0deg));
  background:linear-gradient(90deg,#e8dab7 0%,#777d8a 100%);z-index:-1;
}
/* Reflection is an action beat near the mirror, not a second CUE highlight. */
.slot.mirror-glint[data-item="M"] .slot-content::after{
  content:'✦';position:absolute;top:30px;right:19px;color:#faedb8;font-size:17px;
  text-shadow:0 0 6px #fff1ad;pointer-events:none;
}
/* R2 ripple begins late in ACTION under the already present bell and persists as RESIDUE. */
.scene[data-reaction="R2"] .residue.action-ripple{
  background:repeating-radial-gradient(ellipse,#e6d6a7 0 2px,transparent 3px 8px);
  height:10px;animation:bell-action-ripple .54s linear both;
}
@keyframes bell-action-ripple{0%,60%{opacity:0}85%,100%{opacity:1}}

const SYMBOL = { M: '▣', C: '♨', B: '♟', K: '⚿' };
let timer = null;

function clearAnimation() { if (timer !== null) clearTimeout(timer); timer = null; }
function schedule() {
  clearAnimation();
  const s = game.state;
  if (s.phase !== 'REACT' || document.hidden) return;
  const runId = s.runId;
  timer = setTimeout(() => {
    timer = null;
    if (game.advance(runId) && game.state.phase === 'REACT') schedule();
  }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 180 : 575);
}
function setMessage(title, detail, icon = '✦') { el.title.textContent = title; el.detail.textContent = detail; el.icon.textContent = icon; }
function render(s) {
  const editing = s.canEdit;
  const clue = s.phase === 'REACT' && s.animationStep === 'CUE' ? s.result?.visibleClueSlots : [];
  el.scene.dataset.reaction = s.result?.reactionId ?? '';
  el.scene.dataset.phase = s.phase;
  el.count.textContent = `${s.slots.filter(Boolean).length} / 3`;
  el.shelf.querySelectorAll('[data-slot]').forEach(button => {
    const idx = Number(button.dataset.slot), item = s.slots[idx], content = button.querySelector('.slot-content');
    button.disabled = !editing;
    button.classList.toggle('filled', !!item);
    button.classList.toggle('selected', editing && !!item && s.selectedItemId === item);
    button.classList.toggle('clue', clue?.includes(idx) ?? false);
    button.classList.toggle('secondary-cue', s.phase === 'REACT' && s.animationStep === 'GAZE' && s.result?.reactionId === 'R3' && item === 'B');
    button.classList.toggle('mirror-glint', s.phase === 'REACT' && s.animationStep === 'ACTION' && s.result?.reactionId === 'R1' && item === 'M');
    content.replaceChildren(document.createTextNode(item ? `${SYMBOL[item]} ` : '＋'));
    if (item) { const name = document.createElement('span'); name.className = 'item-mini'; name.textContent = ITEMS[item]; content.append(name); }
    button.setAttribute('aria-label', `${['왼쪽', '가운데', '오른쪽'][idx]} 칸, ${item ? ITEMS[item] : '비어 있음'}${s.selectedItemId ? `, 선택 물건 ${ITEMS[s.selectedItemId]} 배치하기` : ''}`);
    button.dataset.item = item || '';
  });
  el.tray.querySelectorAll('[data-item]').forEach(button => {
    const item = button.dataset.item, placed = s.slots.includes(item);
    button.disabled = !editing || placed;
    button.classList.toggle('placed', placed);
    button.classList.toggle('selected', s.selectedItemId === item);
    button.setAttribute('aria-pressed', String(s.selectedItemId === item));
    button.setAttribute('aria-label', `${ITEMS[item]}${placed ? ' (선반에 놓임)' : ' 선택'}`);
  });
  el.visitor.dataset.beat = s.phase === 'REACT' ? s.animationStep : '';
  el.visitor.dataset.reaction = s.result?.reactionId ?? '';
  const gazeTarget = s.result?.reactionId === 'H' ? 1
    : s.result?.reactionId === 'R1' ? s.slotSnapshot.indexOf('M')
    : s.result?.reactionId === 'R2' ? s.slotSnapshot.indexOf('C')
    : s.result?.reactionId === 'R3' ? s.slotSnapshot.indexOf('B') : 1;
  el.visitor.style.setProperty('--gaze-shift', `${(gazeTarget - 1) * 18}px`);
  // The hand moves from the visitor to the fixed doorplate, scaled to the actual scene width.
  // This visual-only measure does not affect placement, evaluation, or the immutable slot snapshot.
  if (s.result?.reactionId === 'R3' && s.phase === 'REACT' && s.animationStep === 'ACTION') {
    const plate = el.doorplate.getBoundingClientRect(), person = el.visitor.getBoundingClientRect();
    const reachX = plate.left + plate.width / 2 - (person.left + person.width + 1);
    const reachY = plate.top + plate.height / 2 - (person.top + 79);
    el.visitor.style.setProperty('--wipe-x', `${reachX}px`);
    el.visitor.style.setProperty('--wipe-y', `${reachY}px`);
  }
  // The hand touches the ACTUAL mirror/bell item, independent of its slot index.
  if (s.phase === 'REACT' && s.animationStep === 'ACTION' && ['R1','R2'].includes(s.result?.reactionId)) {
    const targetItem = s.result.reactionId === 'R1' ? 'M' : 'B';
    const targetSlot = s.slotSnapshot.indexOf(targetItem);
    const icon = el.shelf.querySelector(`[data-slot="${targetSlot}"] .slot-content`).getBoundingClientRect();
    const visitor = el.visitor.getBoundingClientRect();
    const dx = (icon.left + icon.width / 2) - (visitor.right + 1);
    const dy = (icon.top + icon.height / 2) - (visitor.top + 79);
    el.visitor.style.setProperty('--target-dx', `${dx}px`);
    el.visitor.style.setProperty('--target-dy', `${dy}px`);
    el.visitor.style.setProperty('--reach-length', `${Math.hypot(dx,dy)}px`);
    el.visitor.style.setProperty('--reach-angle', `${Math.atan2(-dy,-dx)*180/Math.PI}deg`);
  }
  const residueShown = s.phase === 'RESULT' || (s.phase === 'REACT' && s.animationStep === 'RESIDUE');
  el.residue.classList.toggle('active', residueShown);
  el.residue.classList.toggle('action-ripple', s.phase === 'REACT' && s.animationStep === 'ACTION' && s.result?.reactionId === 'R2');
  el.doorplate.classList.toggle('revealed', residueShown && s.result?.reactionId === 'R3');
  el.doorplate.classList.toggle('wiping', s.phase === 'REACT' && s.animationStep === 'ACTION' && s.result?.reactionId === 'R3');
  // The visible residue tracks the *actual* mirror/bell slot, not an assumed middle slot.
  const markItem = s.result?.reactionId === 'R1' ? 'M' : s.result?.reactionId === 'R2' ? 'B' : null;
  const markSlot = markItem ? s.slotSnapshot.indexOf(markItem) : -1;
  el.residue.style.setProperty('--residue-left', `${markSlot < 0 ? 50 : (markSlot + .5) / 3 * 100}%`);
  el.guest.classList.toggle('active', (s.phase === 'REACT' && ['ACTION', 'RESIDUE'].includes(s.animationStep) || residueShown) && s.result?.reactionId === 'H');
  el.primary.hidden = s.phase === 'REACT';
  el.skip.hidden = s.phase !== 'REACT';
  el.note.textContent = editing && s.selectedItemId ? `선택: ${ITEMS[s.selectedItemId]} → 칸 누르기` : '물건 선택 → 선반 칸 선택';
  el.counter.textContent = `방문 기록 ${s.history.length}회`;
  if (s.phase === 'PLACE') {
    el.primary.disabled = true;
    el.primary.textContent = `문 열기 · 물건 ${3 - s.slots.filter(Boolean).length}개 더 필요`;
    setMessage('무엇을 올려놓을까요?', s.selectedItemId ? '어느 칸에 놓을지 선택해 주세요.' : '물건을 골라 선반 칸을 누르세요.', '✦');
  } else if (s.phase === 'READY') {
    el.primary.disabled = false; el.primary.textContent = '문 열기';
    setMessage('준비되었습니다', '문을 열면 손님이 이 배치를 살펴봅니다.', '◈');
  } else if (s.phase === 'REACT') {
    setMessage('손님이 들어왔습니다', PRESENTATION[s.result.reactionId][s.animationStep], '◌');
  } else if (s.phase === 'RESULT') {
    el.primary.disabled = false; el.primary.textContent = '다시 배치';
    setMessage(LABEL[s.result.reactionId], PRESENTATION[s.result.reactionId].RESIDUE, '✧');
  }
}

el.tray.addEventListener('click', e => {
  if (performance.now() < suppressClickUntil) return;
  const card = e.target.closest('[data-item]'); if (card) game.select(card.dataset.item);
});
el.shelf.addEventListener('click', e => {
  if (performance.now() < suppressClickUntil) return;
  const button = e.target.closest('[data-slot]'); if (!button || !game.state.canEdit) return;
  if (game.state.selectedItemId) game.placeSelected(Number(button.dataset.slot));
  else if (button.dataset.item) game.select(button.dataset.item);
});
el.primary.addEventListener('click', () => {
  if (game.state.phase === 'READY') { if (game.open()) schedule(); }
  else if (game.state.phase === 'RESULT') game.rearrange();
});
el.skip.addEventListener('click', () => { clearAnimation(); game.skip(); });
$('reset').addEventListener('click', () => { clearAnimation(); game.reset(); });

// Optional HTML drag-and-drop (desktop), routed to the same place command as taps.
document.addEventListener('dragstart', e => {
  const item = e.target.closest('[data-item]');
  if (!item || !game.state.canEdit) { e.preventDefault(); return; }
  e.dataTransfer.setData('text/plain', item.dataset.item); e.dataTransfer.effectAllowed = 'move';
});
el.shelf.addEventListener('dragover', e => {
  if (!game.state.canEdit) return;
  const slot = e.target.closest('[data-slot]'); if (!slot) return;
  e.preventDefault(); slot.classList.add('drop-target');
});
el.shelf.addEventListener('dragleave', e => { const slot = e.target.closest('[data-slot]'); if (slot) slot.classList.remove('drop-target'); });
el.shelf.addEventListener('drop', e => {
  const slot = e.target.closest('[data-slot]'); if (!slot) return;
  e.preventDefault(); el.shelf.querySelectorAll('.slot').forEach(x => x.classList.remove('drop-target'));
  game.place(e.dataTransfer.getData('text/plain'), Number(slot.dataset.slot), 'drag');
});
// Touch/pointer dragging: do not intercept taps. Only a moved pointer creates a drop.
document.addEventListener('pointerdown', e => {
  if (!game.state.canEdit || e.button !== 0) return;
  const item = e.target.closest('[data-item]');
  if (!item) return;
  pointing = { id: e.pointerId, item: item.dataset.item, x: e.clientX, y: e.clientY, moved: false };
});
document.addEventListener('pointermove', e => {
  if (!pointing || e.pointerId !== pointing.id) return;
  if (Math.hypot(e.clientX - pointing.x, e.clientY - pointing.y) > 12) pointing.moved = true;
  if (pointing.moved) {
    el.shelf.querySelectorAll('.slot').forEach(x => x.classList.remove('drop-target'));
    document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slot]')?.classList.add('drop-target');
  }
});
document.addEventListener('pointerup', e => {
  if (!pointing || e.pointerId !== pointing.id) return;
  if (pointing.moved) {
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slot]');
    if (target) game.place(pointing.item, Number(target.dataset.slot), 'drag');
    // Prevent the pointer gesture from becoming a second tap action.
    suppressClickUntil = performance.now() + 120;
  }
  pointing = null;
  el.shelf.querySelectorAll('.slot').forEach(x => x.classList.remove('drop-target'));
});
document.addEventListener('pointercancel', () => {
  pointing = null;
  el.shelf.querySelectorAll('.slot').forEach(x => x.classList.remove('drop-target'));
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearAnimation(); backgroundProcessed = game.state.phase === 'REACT';
  } else if (backgroundProcessed) {
    backgroundProcessed = false; clearAnimation(); game.resumeAfterBackground();
  }
});
// QA access in devtools only, never rendered to players or sent to a server.
window.__KAI_QA__ = Object.freeze({ get state() { return game.state; }, get events() { return game.debugEvents; } });
render(game.state);

</script>
</head>
<body>
  <main class="game" aria-labelledby="title">
    <header class="header">
      <div><span class="eyebrow">EXPERIMENT B · 0.1.2</span><h1 id="title">한밤의 진열장</h1></div>
      <button id="reset" type="button" class="reset">처음부터</button>
    </header>
    <section class="scene" aria-label="손님과 선반을 관찰하는 무대">
      <div class="moon" aria-hidden="true"></div>
      <div class="doorplate" aria-hidden="true"><span class="doorhole" id="doorhole">◖◗</span></div>
      <div class="visitor" id="visitor" aria-hidden="true"><span class="visitor-head"><i class="eye eye-left"></i><i class="eye eye-right"></i></span><span class="visitor-body"></span><span class="visitor-arm" id="arm"></span></div>
      <div class="hidden-guest" id="hidden-guest" aria-hidden="true">♧</div>
      <div class="shelf-wrap">
        <div class="shelf-title">작은 물건을 올려 주세요 <span id="count">0 / 3</span></div>
        <div class="shelf" id="shelf" role="group" aria-label="왼쪽, 가운데, 오른쪽 선반 슬롯">
          <button type="button" class="slot" data-slot="0" aria-label="왼쪽 칸, 비어 있음"><span class="slot-caption">왼쪽</span><span class="slot-content">＋</span></button>
          <button type="button" class="slot" data-slot="1" aria-label="가운데 칸, 비어 있음"><span class="slot-caption">가운데</span><span class="slot-content">＋</span></button>
          <button type="button" class="slot" data-slot="2" aria-label="오른쪽 칸, 비어 있음"><span class="slot-caption">오른쪽</span><span class="slot-content">＋</span></button>
        </div>
        <div class="residue" id="residue" aria-hidden="true"></div>
      </div>
    </section>
    <section class="message" aria-label="손님 반응 및 배치 안내" aria-live="polite">
      <span class="message-icon" id="message-icon" aria-hidden="true">✦</span>
      <div><div class="message-title" id="message-title">밤이 시작되었습니다</div><p id="message-detail">물건을 골라 선반 칸을 누르세요.</p></div>
    </section>
    <section class="tray-section" aria-label="물건 트레이">
      <div class="section-label">물건 <span id="selection-note">물건 선택 → 선반 칸 선택</span></div>
      <div class="tray" id="tray">
        <button type="button" class="item-card" data-item="M" draggable="true" aria-label="거울 선택"><span class="item-icon" aria-hidden="true">▣</span><span>거울</span></button>
        <button type="button" class="item-card" data-item="C" draggable="true" aria-label="촛불 선택"><span class="item-icon" aria-hidden="true">♨</span><span>촛불</span></button>
        <button type="button" class="item-card" data-item="B" draggable="true" aria-label="종 선택"><span class="item-icon" aria-hidden="true">♟</span><span>종</span></button>
        <button type="button" class="item-card" data-item="K" draggable="true" aria-label="열쇠 선택"><span class="item-icon" aria-hidden="true">⚿</span><span>열쇠</span></button>
      </div>
    </section>
    <section class="controls" aria-label="진행 버튼">
      <button id="primary" type="button" class="primary" disabled>문 열기 · 물건 3개 필요</button>
      <button id="skip" type="button" class="secondary" hidden>연출 건너뛰기</button>
      <p id="counter" class="counter">방문 기록 0회</p>
    </section>
    <footer>짧은 게임 플레이 실험 · 최종 게임 및 아트가 아닙니다</footer>
  </main>
</body>
</html>
